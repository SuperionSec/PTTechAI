# PTTechAI v3 - Docker Compose Configuration
# Usage:
#   docker compose -p pttechai up -d              # Start all services
#   docker compose -p pttechai up -d postgres     # Start only PostgreSQL (for local dev)
#   docker compose -p pttechai logs -f backend    # View backend logs
#
# Database auto-initialization:
#   The backend container automatically runs init_db + init_admin + init_permissions
#   on first startup. No manual setup needed.

services:
  postgres:
    image: postgres:16-alpine
    container_name: pttechai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pttechai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pttechai}
      POSTGRES_DB: ${POSTGRES_DB:-pttechai}
    volumes:
      - pttechai-postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pttechai} -d ${POSTGRES_DB:-pttechai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      # Use Dockerfile.backend.lite for faster builds (no security tools)
      # Use Dockerfile.backend for full version with all tools
      dockerfile: deploy/docker/Dockerfile.backend.lite
    container_name: pttechai-backend
    env_file:
      - ../.env
    environment:
      # These override .env if set
      - DEBUG=${DEBUG:-true}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env before starting PTTechAI}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DATABASE_URL=${DOCKER_DATABASE_URL:-postgresql+asyncpg://pttechai:pttechai@postgres:5432/pttechai}
    volumes:
      - pttechai-data:/app/backend/pentest/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.frontend
    container_name: pttechai-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pttechai-postgres-data:
  pttechai-data:

networks:
  default:
    name: bctechai-network
    external: true
