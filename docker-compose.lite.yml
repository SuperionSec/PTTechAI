# PTTechAI v3 - LITE Docker Compose
# Fast builds without external security tools
# Usage: docker compose -f docker-compose.lite.yml up --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: pttechai-postgres
    environment:
      POSTGRES_USER: pttechai
      POSTGRES_PASSWORD: pttechai
      POSTGRES_DB: pttechai
    volumes:
      - pttechai-postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pttechai -d pttechai"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend.lite
    container_name: pttechai-backend
    env_file:
      - .env
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DATABASE_URL=postgresql+asyncpg://pttechai:pttechai@postgres:5432/pttechai
    volumes:
      - pttechai-data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: pttechai-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pttechai-postgres-data:
  pttechai-data:

networks:
  default:
    name: bctechai-network
