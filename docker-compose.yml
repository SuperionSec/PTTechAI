services:
  backend:
    build:
      context: .
      # Use Dockerfile.backend.lite for faster builds (no security tools)
      # Use Dockerfile.backend for full version with all tools
      dockerfile: docker/Dockerfile.backend
    container_name: pttechai-backend
    env_file:
      - .env
    environment:
      # These override .env if set
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DATABASE_URL=sqlite+aiosqlite:///./data/bctechai.db
    volumes:
      - bctechai-data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: pttechai-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bctechai-data:

networks:
  default:
    name: bctechai-network
